[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sem2"
version = "0.1.0"
description = "SEM2 Package"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "pandas",
    "pydantic>=2",
    "pytest",
]

[project.optional-dependencies]
docs = ["sphinx>=8,<9", "pydata-sphinx-theme>=0.15"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sem2", "sem2.*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
