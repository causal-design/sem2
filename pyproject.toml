[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sem2"
version = "0.1.0"
description = "SEM2 Package"
requires-python = ">=3.14"
dependencies = [
    "torch",
    "numpy",
    "pydantic",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sem2", "sem2.*"]
